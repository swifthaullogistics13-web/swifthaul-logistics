
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50">
<title>SwiftHaul Logistics | Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#f3f6fb;color:#1d2939}
header,.panel{max-width:900px;margin:18px auto;background:white;padding:22px;border-radius:12px;box-shadow:0 4px 18px #102b5012}
header{text-align:center;background:#102b50;color:white}
h1,h2{margin-top:0}
input,select,button,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5e0;border-radius:7px;font-size:15px}
button{background:#f2a900;color:#102b50;font-weight:bold;border:0;cursor:pointer}
button.secondary{background:#174a83;color:white}
button.danger{background:#a52a2a;color:white}
.shipment{border:1px solid #d8e0eb;border-radius:9px;padding:14px;margin:12px 0;overflow-wrap:anywhere}
.shipment p{margin:5px 0}
.status{font-weight:bold;color:#174a83}
#message{padding:10px;margin:10px 0;border-radius:7px;white-space:pre-wrap}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>SwiftHaul Logistics</h1>
<p>Administrator Dashboard</p>
<p>Established 2017</p>
</header>

<section class="panel" id="loginPanel">
<h2>Administrator Login</h2>
<p>Enter your existing administrator key.</p>
<input id="adminKey" type="password" placeholder="Admin key" autocomplete="current-password">
<button onclick="login()">Sign In</button>
</section>

<div id="dashboard" class="hidden">

<section class="panel">
<h2>Dashboard</h2>
<button class="secondary" onclick="loadShipments()">Refresh Shipment List</button>
<button class="danger" onclick="logout()">Sign Out</button>
<div id="message" aria-live="polite"></div>
</section>

<section class="panel">
<h2>Create a Shipment</h2>
<form id="createForm">
<input name="sender_name" placeholder="Sender name" required>
<input name="recipient_name" placeholder="Recipient name" required>
<input name="origin" placeholder="Origin" required>
<input name="destination" placeholder="Destination" required>
<input name="service" placeholder="Delivery service" required>
<input name="package_description" placeholder="Package description">
<input name="weight" placeholder="Package weight">
<input name="eta" placeholder="Estimated delivery date">
<button type="submit">Create Shipment</button>
</form>
<div id="createdResult"></div>
</section>

<section class="panel">
<h2>Update Shipment Status</h2>
<form id="updateForm">
<input id="updateTracking" placeholder="Existing tracking number" required>
<select id="updateStatus" required>
<option value="">Choose shipment status</option>
<option>Shipment Received</option>
<option>Processing</option>
<option>In Transit</option>
<option>Arrived at Facility</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>Delivery Delayed</option>
<option>Held for Review</option>
</select>
<input id="updateLocation" placeholder="Current location">
<textarea id="updateNote" placeholder="Shipment update note"></textarea>
<button type="submit">Update Status</button>
</form>
</section>

<section class="panel">
<h2>All Shipments</h2>
<div id="shipmentList">Select Refresh Shipment List to load records.</div>
</section>

</div>

<script>
let adminKey = "";

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "x-admin-key": adminKey,
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || "Request failed");
  }

  return data;
}

async function login() {
  adminKey = document.getElementById("adminKey").value.trim();

  if (!adminKey) {
    alert("Please enter your admin key.");
    return;
  }

  try {
    await api("/api/admin/shipments");
    document.getElementById("loginPanel").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    showMessage("Connected successfully.");
    await loadShipments();
  } catch (error) {
    adminKey = "";
    alert("Login failed. Check your admin key.");
  }
}

function logout() {
  adminKey = "";
  document.getElementById("adminKey").value = "";
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginPanel").classList.remove("hidden");
}

document.getElementById("createForm").addEventListener("submit", async event => {
  event.preventDefault();

  const form = new FormData(event.target);
  const shipment = Object.fromEntries(form.entries());

  try {
    const result = await api("/api/admin/shipments", {
      method: "POST",
      body: JSON.stringify(shipment)
    });

    document.getElementById("createdResult").textContent =
      "Shipment created. Tracking number: " + result.tracking_number;

    event.target.reset();
    await loadShipments();
    showMessage("Shipment created successfully.");
  } catch (error) {
    showMessage(error.message);
  }
});

document.getElementById("updateForm").addEventListener("submit", async event => {
  event.preventDefault();

  const tracking = document.getElementById("updateTracking").value.trim();

  try {
    await api("/api/admin/shipments/" + encodeURIComponent(tracking) + "/events", {
      method: "POST",
      body: JSON.stringify({
        status: document.getElementById("updateStatus").value,
        location: document.getElementById("updateLocation").value,
        note: document.getElementById("updateNote").value
      })
    });

    showMessage("Shipment status updated successfully.");
    event.target.reset();
    await loadShipments();
  } catch (error) {
    showMessage(error.message);
  }
});

async function loadShipments() {
  const list = document.getElementById("shipmentList");
  list.textContent = "Loading shipments...";

  try {
    const shipments = await api("/api/admin/shipments");

    if (!shipments.length) {
      list.textContent = "No shipments have been recorded yet.";
      return;
    }

    list.replaceChildren();

    shipments.forEach(shipment => {
      const card = document.createElement("article");
      card.className = "shipment";

      const details = [
        ["Tracking number", shipment.tracking_number],
        ["Sender", shipment.sender_name],
        ["Recipient", shipment.recipient_name],
        ["Origin", shipment.origin],
        ["Destination", shipment.destination],
        ["Service", shipment.service],
        ["Description", shipment.package_description],
        ["Weight", shipment.weight],
        ["Estimated delivery", shipment.eta],
        ["Status", shipment.status]
      ];

      details.forEach(([label, value]) => {
        if (value) {
          const p = document.createElement("p");
          p.textContent = label + ": " + value;
          card.appendChild(p);
        }
      });

      list.appendChild(card);
    });
  } catch (error) {
    list.textContent = error.message;
  }
}
</script>
</body>
</html>
